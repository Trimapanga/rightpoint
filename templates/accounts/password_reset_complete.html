{% extends "accounts/base_auth.html" %}

{% block title %}Password updated – Right Point Solutions{% endblock %}

{% block auth_content %}
<div class="auth-state-icon auth-state-ok" aria-hidden="true">
  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="48" height="48" rx="14" fill="url(#grad-ok2)"/>
    <path d="m14 25 7 7 13-14" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="grad-ok2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#1a7a42"/><stop offset="1" stop-color="#128c7e"/></linearGradient></defs>
  </svg>
</div>
<h1 class="auth-heading">Password updated</h1>
<p class="auth-sub">Your new password is set. You can sign in now.</p>
<a class="btn btn-solid btn-lg auth-submit" href="{% url 'accounts:login' %}">Sign in</a>
{% endblock %}

{% block auth_footer %}
  Need help? <a href="{% url 'contact:form' %}">Contact us</a>
{% endblock %}
