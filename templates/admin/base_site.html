{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}{{ block.super }}
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon-192.png' %}">
{% endblock %}

{% block extrastyle %}{{ block.super }}
<style>
  /* Brand colours through Django's own theme variables, so every admin page picks
     them up without fighting the stock stylesheets. */
  /* The whole light palette is restated here, in every colour scheme: Django's dark
     mode would otherwise mix with these brand colours and leave some text unreadable. */
  :root, :root[data-theme="light"], :root[data-theme="dark"], :root[data-theme="auto"] {
    color-scheme: light;
    --body-fg: #1b2733;
    --body-bg: #fff;
    --body-quiet-color: #5b6b78;
    --body-medium-color: #3b4a58;
    --body-loud-color: #0b2c3e;
    --hairline-color: #e3e9ef;
    --border-color: #cdd6df;
    --error-fg: #ba2121;
    --message-success-bg: #dff5e6;
    --message-warning-bg: #fff6d6;
    --message-error-bg: #ffefef;
    --darkened-bg: #f5f8fb;
    --close-button-bg: #747474;
    --close-button-hover-bg: #333;
    --delete-button-bg: #ba2121;
    --delete-button-hover-bg: #a41515;
    --primary: #0b2c3e;
    --secondary: #0b3aa8;
    --accent: #1a6035;
    --primary-fg: #fff;
    --header-bg: #0b2c3e;
    --header-color: #fff;
    --header-branding-color: #fff;
    --header-link-color: #fff;
    --breadcrumbs-bg: #0b3aa8;
    --breadcrumbs-fg: #dbe6ff;
    --breadcrumbs-link-fg: #fff;
    --link-fg: #0b3aa8;
    --link-hover-color: #082d85;
    --link-selected-fg: #1a6035;
    --button-bg: #0b3aa8;
    --button-hover-bg: #082d85;
    --default-button-bg: #1a6035;
    --default-button-hover-bg: #134a28;
    --object-tools-bg: #0b3aa8;
    --object-tools-hover-bg: #082d85;
    --selected-bg: #e8f1ff;
    --selected-row: #fff8d6;
  }
  body { background: #f3f6fa; }
  .theme-toggle { display: none; }
  #header { padding: 10px 28px; border-bottom: 3px solid #1a6035; }
  #branding h1 { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 600; margin: 0; }
  #branding h1 a, #branding h1 a:link, #branding h1 a:visited { color: #fff; }
  #branding h1 img { height: 40px; width: auto; background: #fff; border-radius: 8px; padding: 3px 6px; }
  #user-tools { font-size: .78rem; letter-spacing: .04em; }
  div.breadcrumbs { padding: 10px 28px; }
  #content { padding: 24px 28px; }
  #content h1 { font-weight: 700; letter-spacing: -.01em; color: #0b2c3e; }
  .module, #changelist-filter, .results, .inline-group, fieldset.module {
    border-radius: 10px;
    overflow: hidden;
  }
  .module { box-shadow: 0 1px 3px rgba(11, 44, 62, .06); }
  .module caption, .module h2, .inline-group h2 {
    background: var(--primary); color: #fff;
    font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 600;
  }
  .module caption a, .module caption a:link, .module caption a:visited { color: #fff; }
  #changelist .results table thead th { background: #eef3f9; }
  #changelist .results table thead th a { color: #0b2c3e; text-transform: uppercase; font-size: .72rem; letter-spacing: .06em; }
  #changelist-filter { box-shadow: 0 1px 3px rgba(11, 44, 62, .06); }
  #changelist-filter h2 { background: var(--primary); color: #fff; }
  a.addlink, a.changelink, a.viewlink { font-weight: 600; }
  input[type=text], input[type=password], input[type=email], input[type=number], input[type=url],
  input[type=date], input[type=time], select, textarea { border-radius: 7px; padding: 7px 10px; }
  input:focus, select:focus, textarea:focus { outline: 0; border-color: #0b3aa8 !important; box-shadow: 0 0 0 3px rgba(11, 58, 168, .15); }
  .button, input[type=submit], input[type=button], .submit-row input, a.button { border-radius: 7px; font-weight: 600; }
  .submit-row { border-radius: 10px; }
  #nav-sidebar { background: #fff; }
  #nav-sidebar .module caption a { color: #fff; }

  /* No filter column on list pages; search and column sorting remain. */
  #changelist-filter, #changelist-filter-extra-actions, .filter-toggle, #changelist .changelist-filter-toggle { display: none !important; }
  #changelist .changelist-form-container { margin-right: 0 !important; width: 100% !important; }
  /* Dashboard */
  .dashboard #content { width: auto; max-width: 1280px; margin-inline: auto; padding-top: 22px; }
  .dashboard #content > h1 { display: none; }
  .rps-welcome { margin: 0 0 18px; font-size: 1.05rem; color: var(--body-medium-color); }
  .rps-welcome strong { color: #0b2c3e; }
  .rps-stats { list-style: none; margin: 0 0 30px; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .rps-stat { list-style: none; padding: 0; background: none; border: 0; }
  .rps-stat::marker { content: ""; }
  .rps-stat a {
    display: block; padding: 16px 18px; background: #fff; border: 1px solid var(--hairline-color);
    border-top: 3px solid #0b3aa8; border-radius: 10px; text-decoration: none;
    box-shadow: 0 1px 3px rgba(11, 44, 62, .06); transition: transform .15s, box-shadow .15s;
  }
  .rps-stat a:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(11, 44, 62, .12); }
  .rps-stat.warn a { border-top-color: #d99a00; }
  .rps-stat.alert a { border-top-color: #c0392b; }
  .rps-stat-label { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--body-quiet-color); }
  .rps-stat-value { display: block; margin: 6px 0 2px; font-size: 2rem; font-weight: 700; line-height: 1.1; color: #0b2c3e; font-variant-numeric: tabular-nums; }
  .rps-stat-note { display: block; font-size: .8rem; color: var(--body-quiet-color); }
  .rps-section-title { margin: 0 0 12px; font-size: .78rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--body-quiet-color); }
  .dashboard #content-main .app-list, .dashboard #content-main > .module { }
  .dashboard #content-main { float: none; width: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; align-items: start; }
  .dashboard #content-main > .rps-welcome, .dashboard #content-main > .rps-stats, .dashboard #content-main > .rps-section-title { grid-column: 1 / -1; margin-bottom: 0; }
  .dashboard #content-main > .rps-stats { margin-bottom: 12px; }
  .dashboard #content-main .module { margin: 0; }
  .dashboard #content-related { width: auto; float: none; margin: 28px 0 0; }
  .dashboard #content-related .module { max-width: 520px; background: #fff; }
  .dashboard #content-related h2 { background: var(--primary); color: #fff; padding: 10px 14px; margin: 0; font-size: .74rem; letter-spacing: .09em; }

  /* Manage: app cards */
  .dashboard .app-list, .dashboard #content-main .module { border: 1px solid var(--hairline-color); border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(11,44,62,.06); overflow: hidden; transition: box-shadow .15s; }
  .dashboard #content-main .module:hover { box-shadow: 0 6px 18px rgba(11,44,62,.10); }
  .dashboard .module caption { display: flex; align-items: center; gap: 10px; padding: 14px 16px; text-align: left; background: #fff; color: #0b2c3e; border-bottom: 1px solid var(--hairline-color); font-size: .8rem; letter-spacing: .06em; }
  .dashboard .module caption a, .dashboard .module caption a:link, .dashboard .module caption a:visited { color: #0b2c3e; }
  .dashboard .module caption::before { content: ''; flex: 0 0 34px; height: 34px; border-radius: 9px; background: #0b3aa8 center / 18px no-repeat; }
  .dashboard .app-auth caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Ccircle cx=%2212%22 cy=%228%22 r=%224%22/%3E%3Cpath d=%22M4 21c0-4 4-6 8-6s8 2 8 6%22/%3E%3C/svg%3E"); }
  .dashboard .app-casestudies caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Crect x=%223%22 y=%224%22 width=%2218%22 height=%2216%22 rx=%222%22/%3E%3Cpath d=%22M7 9h10M7 13h10M7 17h6%22/%3E%3C/svg%3E"); }
  .dashboard .app-contact caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M4 5h16v12H8l-4 4z%22/%3E%3C/svg%3E"); }
  .dashboard .app-invoices caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M6 3h12v18l-3-2-3 2-3-2-3 2z%22/%3E%3Cpath d=%22M9 8h6M9 12h6%22/%3E%3C/svg%3E"); }
  .dashboard .app-products caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M21 8l-9-5-9 5 9 5 9-5z%22/%3E%3Cpath d=%22M3 8v8l9 5 9-5V8%22/%3E%3C/svg%3E"); }
  .dashboard .app-quotes caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M14 3H6v18h12V7z%22/%3E%3Cpath d=%22M14 3v4h4M9 13h6M9 17h6%22/%3E%3C/svg%3E"); }
  .dashboard .app-core caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%223%22/%3E%3Cpath d=%22M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2%22/%3E%3C/svg%3E"); }
  .dashboard .app-sites caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%229%22/%3E%3Cpath d=%22M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18%22/%3E%3C/svg%3E"); }
  .dashboard .app-solutions caption::before { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z%22/%3E%3Cpath d=%22M9 12l2 2 4-4%22/%3E%3C/svg%3E"); }
  .dashboard .app-auth caption::before, .dashboard .app-core caption::before { background-color: #475569; }
  .dashboard .app-invoices caption::before, .dashboard .app-products caption::before { background-color: #1a6035; }
  .dashboard .app-contact caption::before, .dashboard .app-quotes caption::before { background-color: #0b3aa8; }
  .dashboard .app-casestudies caption::before, .dashboard .app-solutions caption::before, .dashboard .app-sites caption::before { background-color: #0b2c3e; }
  .dashboard .module table { border-collapse: collapse; }
  .dashboard .module tr { border-top: 0; }
  .dashboard .module tbody tr + tr th, .dashboard .module tbody tr + tr td { border-top: 1px solid #eef2f6; }
  .dashboard .module th, .dashboard .module td { padding: 10px 16px; font-size: .88rem; vertical-align: middle; background: transparent; }
  .dashboard .module th a { font-weight: 600; color: #0b2c3e; }
  .dashboard .module tr:hover th, .dashboard .module tr:hover td { background: #f6f9fc; }
  .dashboard .module th a:hover { color: #0b3aa8; }
  .dashboard .module td { width: 1%; white-space: nowrap; text-align: right; }
  .dashboard .module td + td { padding-left: 0; }
  .dashboard .module td a { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .75rem; font-weight: 600; text-decoration: none; background-image: none !important; padding-left: 11px !important; }
  .dashboard .module td a.addlink { color: #1a6035; background: #e6f4ec; }
  .dashboard .module td a.addlink::before { content: '+ '; }
  .dashboard .module td a.changelink, .dashboard .module td a.viewlink { color: #0b3aa8; background: #e8f0ff; }
  .dashboard .module td a:hover { filter: brightness(.95); }
  .dashboard .rps-section-title { margin-top: 6px; }
  .dashboard .module tbody tr:nth-child(even) th, .dashboard .module tbody tr:nth-child(even) td { background: transparent; }
  .dashboard .module tbody tr:nth-child(even):hover th, .dashboard .module tbody tr:nth-child(even):hover td { background: #f6f9fc; }
  @media (max-width: 767px) {
    #header { padding: 10px 14px; }
    #content { padding: 16px 14px; }
  }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}" style="display:flex;align-items:center;gap:12px">
    <img src="{% static 'img/logo.png' %}" alt="">
    <span>Right Point Solutions administration</span>
  </a>
</h1>
{% endblock %}
