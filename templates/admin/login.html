{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root, :root[data-theme="light"] {
    --primary: #0b3aa8;
    --secondary: #0b2c3e;
    --accent: #1a6035;
    --primary-fg: #fff;
    --header-bg: #0b2c3e;
    --header-color: #fff;
    --header-branding-color: #fff;
    --button-bg: #0b3aa8;
    --button-hover-bg: #082d85;
    --default-button-bg: #0b3aa8;
    --default-button-hover-bg: #082d85;
    --link-fg: #0b3aa8;
  }
  :root { color-scheme: light; }
  body.login {
    background: linear-gradient(160deg, #eef3fb 0%, #f7faf8 55%, #e9f4ec 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 0;
  }
  .login #container {
    width: min(100% - 32px, 400px);
    border: 0; border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(11, 44, 62, .16), 0 2px 6px rgba(11, 44, 62, .06);
    margin: 0; background: #fff; color: #1b2733;
  }
  .login #content { background: #fff; }
  .login #header { padding: 18px 24px; background: #0b2c3e; border-bottom: 3px solid #1a6035; }
  .login #site-name { font-size: 1.05rem; font-weight: 600; letter-spacing: .01em; }
  .login #site-name a { color: #fff; }
  .login #content { padding: 28px 28px 30px; }
  .login .rps-login-logo { display: block; margin: 0 auto 6px; height: 84px; width: auto; max-width: 100%; }
  .login .rps-login-sub { text-align: center; margin: 0 0 22px; color: #5b6b78; font-size: .9rem; }
  .login .form-row { padding: 0; margin-bottom: 16px; }
  .login .form-row label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .85rem; color: #1b2733; width: auto; }
  .login .form-row input { width: 100%; box-sizing: border-box; padding: 11px 13px; font-size: 1rem; border-radius: 9px; border: 1px solid #cdd6df; background: #fff; color: #111; }
  .login .form-row input:focus { outline: 0; border-color: #0b3aa8; box-shadow: 0 0 0 3px rgba(11, 58, 168, .15); }
  .login .submit-row { padding: 6px 0 0; text-align: center; }
  .login .submit-row input {
    width: 100%; padding: 12px; font-size: 1rem; font-weight: 600;
    border-radius: 9px; background: #0b3aa8; border: 0; cursor: pointer;
  }
  .login .submit-row input:hover { background: #082d85; }
  .login .errornote { border-radius: 9px; }
  .login .theme-toggle { display: none; }
  .login .rps-login-sub { color: #5b6b78 !important; }
  .login .password-reset-link { text-align: center; }
</style>
{% endblock %}

{% block content_title %}
<img class="rps-login-logo" src="{% static 'img/logo.png' %}" alt="Right Point Solutions">
<p class="rps-login-sub">Sign in to manage the site</p>
{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">{{ site_header|default:"Administration" }}</a></h1>
{% endblock %}
