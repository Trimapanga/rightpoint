# Local production rehearsal: docker compose up --build
# Web runs the same image the deployment platforms will run.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rightpoint
      POSTGRES_USER: rightpoint
      POSTGRES_PASSWORD: rightpoint
    volumes:
      - pgrdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rightpoint"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "change-me-before-exposing-this-to-the-internet"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: rightpoint
      DJANGO_DB_USER: rightpoint
      DJANGO_DB_PASSWORD: rightpoint
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_SECURE_SSL_REDIRECT: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgrdata:
